spring.application.name=urbancore-api

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/urbancore-a7b10

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.connection-timeout=30000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

geoapify.api-key=${GEOAPIFY_API_KEY}

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.max-output-tokens=512
spring.ai.google.genai.chat.options.temperature=0.2

# Avoid aggressive retries on Gemini Free Tier during quota or high-demand spikes.
spring.ai.retry.max-attempts=1

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
